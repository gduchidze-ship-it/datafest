[project]
name = "datafest-deck"
version = "0.1.0"
description = "Build tooling for the DataFest slide deck."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["tools", "tests"]
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC", "PT", "PERF", "TRY", "C90", "D", "ERA"]
lint.ignore = ["D203", "D213", "TRY003"]
lint.pydocstyle.convention = "google"
lint.mccabe.max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
files = ["tools", "tests"]
mypy_path = "tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers --cov --cov-branch --cov-report=term-missing --cov-fail-under=93"

[tool.coverage.run]
source = ["tools"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]
