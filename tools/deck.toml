[[slides]]
fragment = "slides/08_request_answers.html"
label = "One request, named answers"
section = 2
notes = "This is the contract. The request has a model, shared input, and a questions array. Each question has a type, instructions and a name. Click: the response contains an answers array. Give each question a unique name to identify its answer; the API echoes that name in the response. So map answers by name, not by position. predicate returns a probability; choice and score also return a confidence."
builds = [["res"]]

[[slides]]
fragment = "slides/09_calibration.html"
label = "Calibration"
section = 2
notes = "Calibration is what makes a probability usable. Take every prediction where the model said 0.5 and put them in one jar; every 0.8 in another; every 0.9 in a third. If the model is calibrated, about half of the 0.5 jar is right, 8 of 10 in the 0.8 jar, 9 of 10 in the 0.9 jar. Each jar is one point on a reliability plot, and the points land on the diagonal. The jars and the plot are illustrative. 0.8 means about 80% of these predictions are right, not that this one is. So measure your own reliability curve before code sets thresholds: golden set, shadow mode, reliability curve, thresholds, then conformal guarantees."

[[slides]]
source = 18
label = "Where a decision model falls short"
section = 2
notes = "A decision model is good at fast, cheap, simple decisions: route, gate, classify, score. Once a decision needs a plan, multi-step logic or deep knowledge, the LLM is still better. Five risks to test on your own data; the pictures are illustrative, not measurements. Long context costs more and dilutes evidence. Evidence in the middle of a long input can be missed. Specialised knowledge. Overconfidence: right answer, wrong probability. Inherited bias. These are risks of this model class, not published figures for one product."
