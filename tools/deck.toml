[[slides]]
fragment = "slides/14_harness.html"
label = "Agent = model + harness"
notes = "An agent is a model plus a harness. The model writes text and code. Everything around it is the harness: routing, the loop, tools, context, permissions, memory, checks, handoff. Claude Code, Codex and a LangGraph runner are all harnesses. Look at the question under each job. Eight harness jobs, and every one is a question with a typed answer."

[[slides]]
fragment = "slides/05_mostly_decisions.html"
label = "An agent run is mostly decisions"
notes = "Take one coding-agent run and tag every step. Two steps write: deciding what to read and writing the change. Six steps decide: routing, gating the edit, diagnosing the test failure, the risky command, the doc page, the done check. Six of eight are decisions, and today each one is a full LLM call."

[[slides]]
fragment = "slides/effective.html"
label = "Make Evals A First-Class Citizen"
notes = "Solving real business problems with AI is not about the latest and largest model or the newest agent framework. It is about making evals a first-class citizen and climbing them iteratively with your client's feedback. The evals you need are ones you find yourself; general metrics give a false sense of progress. One: implement a first working version. Two: generate synthetic inputs and compute outputs, the traces. Three: read a sample of traces to find the main failures, the error categories. Four: build simple regex or LLM-as-a-judge evals that measure them. Five: tune prompts, tools, permissions and retrieval, and re-evaluate. Then go back to three. When the set of error categories stops growing, you have your evals, and climbing them moves the system toward what the client needs."

[[slides]]
fragment = "slides/model_selection.html"
label = "Model Selection For Each Task"
notes = "Model choice is now per decision, not per app. The workflow: keep a decision registry, build a golden set for each decision, make both models answer the same schema, run A/B or a cascade with Decisions first and the LLM when confidence is low, and lock it in with CI regression tests."

[[slides]]
fragment = "slides/case_intro.html"
label = "How Impel Cut Costs With The Decisions API"
notes = "The Impel case: jailbreak detection on every inbound message. Before, after, result."

[[slides]]
fragment = "slides/21_jb_before.html"
label = "Before: every message is an LLM call"
notes = "The Impel case. Every inbound message was screened for jailbreaks by GPT 5.1 before the agent replied. A yes/no question, answered with a generation, on 100% of messages. Most traffic is ordinary, and we paid LLM price to confirm it."

[[slides]]
fragment = "slides/22_jb_after.html"
label = "After: cheap checks first, the LLM last"
notes = "The new pipeline. Every message goes to a security Guardrail and one Decisions API call in parallel. If neither flags it, the message is allowed: that is about 90% of traffic. Only what they flag, about 10%, goes to 6.1 Terra, the LLM layer, which rules allow or block. The LLM still makes the hard calls. It just stops making the easy ones."

[[slides]]
fragment = "slides/23_jb_result.html"
label = "Result: 68% lower cost"
notes = "The result: 68% lower cost than the GPT 5.1 detector. Indexed, 100 becomes 32. The stack is the Decisions API plus the security Guardrail plus 6.1 Terra on about 10% of messages. About 90% of messages no longer reach an LLM. This is Impel's internal measurement."

[[slides]]
fragment = "slides/26_code.html"
label = "Code execution"
slide_class = "impel-divider"
notes = "Live code. One predicate and its probability. Many named questions in one request. choice and score with confidence. Thresholds from labelled examples. Gating a tool call in the harness. Escalating low confidence to the LLM."

[[slides]]
fragment = "slides/27_takeaways.html"
label = "Takeaways"
notes = "Three things to take home. One: for every step, ask whether it is writing or deciding. Two: the model returns probabilities and your code makes the call. Three: keep the LLM for the cases that need it; at Impel that is about 10% of jailbreak checks and the bill is 68% lower. Questions."
builds = [["n2"], ["n3"]]
build_effect = "rise"

[[slides]]
source = 21
label = "Is this step writing or deciding?"
notes = "Back to the timeline: reads, writes, decides. One question to take home: for every step in your agent, is this step writing or deciding? If it is deciding, it probably should not be a generation. Thank you. Scan the QR to find me on LinkedIn; I am also on GitHub and X."
