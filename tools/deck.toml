[[slides]]
source = 6
label = "RLHF"
section = 3
notes = "RLHF: the model writes two answers, a human picks the one they prefer, a reward model learns that preference, and the LLM is updated toward it. It optimises for answers raters prefer. Preferred is not the same as correct."
icons = [ { frame = "e8", icon = "person" } ]

[[slides]]
source = 7
label = "RLVR"
section = 3
notes = "RLVR: the model generates many candidates, a verifier such as a test suite or proof checker passes or fails each one, and that becomes the reward. It optimises for outputs a program can verify."
colors = { "#a78bfa" = "#8DDEB7", "#c4b5fd" = "#8DDEB7" }
icons = [ { frame = "e6", icon = "check" } ]

[[slides]]
source = 8
label = "RLCD"
section = 3
notes = "RLCD: state and a question go in, a probability for every typed option comes out. The reward is calibration: honest probabilities, where higher confidence means higher accuracy. The program is in the loop, not a human or a string checker. That is what makes a decision model usable as a smart if-statement."
text = [ { frame = "e5", html = "decision\nmodel" } ]
style = [ { frame = "e5", set = { left = "540px", width = "200px", top = "484px", "font-size" = "26px" } } ]
alt = [ { frame = "e1", text = "Animated RLCD loop: state and question stream into a decision model, which returns probabilities for options A, B and C, rewarded for calibration" } ]
icons = [ { frame = "e9", icon = "target" } ]

# ---------------------------------------------------------------- 4
[[slides]]
fragment = "slides/14_harness.html"
label = "Agent = model + harness"
section = 4
notes = "An agent is a model plus a harness. The model writes text and code. Everything around it is the harness: routing, the loop, tools, context, permissions, memory, checks, handoff. Claude Code, Codex and a LangGraph runner are all harnesses. Look at the question under each job. Click: eight harness jobs, and every one is a question with a typed answer."
builds = [["b1"]]
build_effect = "rise"

[[slides]]
source = 12
label = "AI gateway"
section = 4
notes = "One real request through an AI gateway inside a coding agent. 1: the developer asks to center the login card in LoginPage.tsx. 2: before any model runs, the gateway asks Decisions about domain, risk, complexity and prompt injection, and gets probabilities back. 3: a gateway rule, plain code, uses those numbers to pick the model: low complexity goes to the cheaper model, a hard multi-file refactor to the larger one. 4: the LLM writes the change as a tool call. 5: the gateway asks Decisions again: is the edit destructive, does it match the request, does it stay in scope. 6: the gateway applies the edit. Decisions advises, the gateway decides, the LLM writes. Decide the failure policy per step in advance. Example probabilities are illustrative."
text = [
  { frame = "e9", html = "Decisions" },
  { frame = "e22", html = "Decisions" },
]
style = [
  { frame = "e9", set = { left = "440px", width = "180px", "font-size" = "19px" } },
  { frame = "e22", set = { left = "1330px", width = "180px", "font-size" = "19px" } },
]
alt = [ { frame = "e0", text = "Animated AI gateway in a coding agent: the request passes a Decisions check, a router, the LLM, a second Decisions check, and is applied" } ]

[[slides]]
source = 15
label = "Long-horizon agents with a decision layer"
section = 4
notes = "Long-running agents age: context bloats, tokens compound, quality decays. Split the work. The LLM only plans, at a few camps along a multi-hour run: slow and rare. Above the road runs the decision rail, and every pin is a place a decision model acts. Route to the cheapest model that can do the task. Context: keep what matters, drop what is stale. Tool gate: classify risk before a command runs. Sentinel: label the step and track progress and budget. Done: decide whether the task is finished. Probabilities stay in agent state, so code makes the final call. The gap: a per-step decision model is a weak global verifier for a long run."
text = [
  { frame = "e1", html = "Long-horizon agents with a decision layer" },
  { frame = "e3", html = "Decisions" },
  { frame = "e16", html = "CONTEXT · drop stale" },
  { frame = "e19", html = "Gap: a per-step decision model is a weak global verifier" },
]
alt = [ { frame = "e0", text = "Animated multi-hour agent run: the LLM plans at a few camps on a road while a decision rail above it routes, gates tools and checks progress" } ]

# ---------------------------------------------------------------- 5
[[slides]]
fragment = "slides/17_slop.html"
label = "Slop compounds"
section = 5
notes = "Per-step accuracy is not system success. One step at 95% is fine. Five steps: 77%. Ten: 60%. Twenty: 36%. This is plain arithmetic under independence. Click: what keeps an agent effective is small steps with typed answers, thresholds from your own labelled examples, and code making the final call. Click: raise per-step reliability or cut the number of steps that can fail."
builds = [["fix"], ["b1"]]
build_effect = "rise"

[[slides]]
source = 19
label = "LLM or Decisions? Only evals know."
section = 5
notes = "Model choice is now per decision, not per app. The workflow: keep a decision registry, build a golden set for each decision, make both models answer the same schema, run A/B or a cascade with Decisions first and the LLM when confidence is low, and lock it in with CI regression tests. The metric that matters is automation rate at high precision: how much the decision model handles on its own before precision breaks."
text = [ { frame = "e1", html = "LLM or Decisions? Only evals know." } ]
alt = [ { frame = "e0", text = "Animated eval pipeline: a decision travels through registry, golden set, same schema, A/B or cascade, and CI regression" } ]

