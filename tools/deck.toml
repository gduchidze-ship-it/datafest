# ---------------------------------------------------------------- 3
[[slides]]
source = 5
label = "Intelligence is no longer the bottleneck. Reliability is."
section = 3
notes = "Models are smart enough. The problem is reliability, and reliability depends on what you train for. Three north stars: RLHF puts a human in the loop, RLVR a verifier, RLCD a program."
drop = ["e27", "e13", "e14"]
