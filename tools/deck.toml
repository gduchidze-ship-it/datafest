[[slides]]
fragment = "slides/09_calibration.html"
label = "Calibration"
notes = "Calibration is what makes a probability usable. Take every prediction where the model said 0.5 and put them in one jar; every 0.8 in another; every 0.9 in a third. If the model is calibrated, about half of the 0.5 jar is right, 8 of 10 in the 0.8 jar, 9 of 10 in the 0.9 jar. Each jar is one point on a reliability plot, and the points land on the diagonal. The jars and the plot are illustrative. 0.8 means about 80% of these predictions are right, not that this one is. So measure your own reliability curve before code sets thresholds: golden set, shadow mode, reliability curve, thresholds, then conformal guarantees."

[[slides]]
fragment = "slides/06_llm_vs_decision.html"
label = "LLM vs decision model"
notes = "An LLM generates an answer one token at a time and you parse the text; even with strict prompting it can produce invalid JSON or pick an option you did not allow. A decision model evaluates the input in a single forward pass and returns typed answers with exact probabilities, for example Billing 99.8%, Tech 0.1%, Sales 0.1%, so code can apply hard logic to the model's belief."

[[slides]]
fragment = "slides/classifiers.html"
label = "Decision Models Vs Classifiers"
notes = "Decision models share DNA with classifiers but add runtime flexibility and multi-tasking. All three give a probability over choices. A traditional classifier has its labels fixed at training; zero-shot and decision models take them at inference. Only a decision model answers many typed questions in one call, and ordered scoring and yes/no are native primitives."

[[slides]]
fragment = "slides/limitations.html"
label = "Decision Model Limitations"
notes = "Speed and schema safety do not make decision models infallible. One: zero syntax errors is not 100% accuracy. Across broad benchmarks a decision model scores 67.8% against 74.1% for a frontier reasoning LLM, and if the right answer is not among the allowed choices it is forced to guess. Two: a single forward pass has no scratchpad, so it breaks on arithmetic, date ordering and multi-hop logic, and it is sensitive to phrasing. Three: at runtime you get a probability, not a written audit trail; a raw 0.91 will not satisfy a compliance auditor. Four: hostile text in a payload can still push probabilities toward an allowed but dangerous action. So the production pattern is confidence-based routing: the decision model takes the 80 to 90% of routine traffic where confidence exceeds 95%, and the rest escalates to a reasoning LLM or a human."

[[slides]]
source = 5
label = "Intelligence is no longer the bottleneck. Reliability is."
notes = "Models are smart enough. The problem is reliability, and reliability depends on what you train for. Three north stars: RLHF puts a human in the loop, RLVR a verifier, RLCD a program."
