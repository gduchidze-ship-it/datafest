[[slides]]
fragment = "slides/03_agenda.html"
label = "Agenda"
notes = "The route for the talk: why agents are your next users and what that does to the numbers, what a decision model is and where it stops, how these models are trained, what a harness is, why evals and security matter, the Impel jailbreak case, then live code and takeaways."

[[slides]]
fragment = "slides/04_fanout.html"
label = "Your Next 1 Million Users Are Not Humans"
notes = "One person types one request. The agent turns it into many calls against your software: search, read, call an API, run tests, retry. Your next million users are these machine callers. Click: every one of those calls starts with a decision. Which tool, is it safe, is it done. The diagram is illustrative."

[[slides]]
fragment = "slides/econ_now.html"
label = "2026: Machines Passed Humans"
notes = "When we think about AI adoption we still picture a human typing into a chat box. The next million users of your product or API will be automated software pipelines. In 2026 this has already happened. Cloudflare data shows non-human traffic passed human traffic at 57.5%, driven by a 1,700% surge in AI agent requests. Inside enterprises, nearly two-thirds of production AI API calls are already structured machine decisions, yet they are only 15.5% of token spend because the outputs are tiny."

[[slides]]
fragment = "slides/econ_next.html"
label = "2027-2031: Scale Goes Exponential"
notes = "If 2026 was the crossover point, the next five years are where scale goes exponential. Gartner projects more than 10 billion autonomous agents online by 2030, and Cloudflare forecasts machine traffic reaching 1,000 to 1 over human traffic by 2031. Making decisions fast, typed and far cheaper triggers a rebound effect: cheaper decisions mean far more of them. When software can afford a million background judgments a minute, almost every digital interaction becomes machine-to-machine."

[[slides]]
fragment = "slides/why_decision_models.html"
label = "Why Decision Models"
notes = "Software calling AI in the background does not want a conversational essay; it wants a fast, structured decision. Speed: OpenAI claims the Decisions API is up to 10x faster than GPT-6 Luna through the Responses API; independent testing puts it at roughly 4.6 to 5x. About 150 milliseconds per decision, 255 in independent tests, against roughly 1.2 to 1.6 seconds. Price: input is the same, 10 cents per million tokens, with cached input at 1 cent. The difference is output: the Decisions API has no output charge because it returns bounded selections and probabilities, while the Responses API charges 50 to 60 cents per million output tokens. The roughly 2x on the slide is an illustration, not a benchmark: a 1,000-token input with a 200-token answer costs about 0.021 cents through the Responses API against 0.010 cents through the Decisions API. Longer answers widen the gap, shorter ones narrow it."

[[slides]]
source = 9
label = "How Decisions works"
notes = "Input: shared evidence plus a list of questions. One Decisions call answers them together, each with a typed result. Three primitives. predicate checks a condition and returns the probability that it is true: an if. choice selects one of your values: a switch. score rates against ordered levels and returns the probability-weighted average of the level indices: a slider. One request takes 1 to 400 questions."
