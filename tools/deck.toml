[[slides]]
source = 2
label = "Giorgi Duchidze"
notes = "Quick intro: I'm Giorgi Duchidze, Software Engineer at Impel and an OpenAI Codex Ambassador. I work on agent harnesses, and that is what this talk is about."
text = [ { frame = "e3", html = "SPEAKER" } ]
