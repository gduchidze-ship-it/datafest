label = "Agenda"
notes = "Nine parts. Why agents are your next users, what a decision model is, how these models are trained, what a harness is, how to avoid slop, the Impel jailbreak case, the harness design before and after, then live code, and takeaways."

# ---------------------------------------------------------------- 1
[[slides]]
fragment = "slides/04_fanout.html"
label = "Your Next 1 Million Users Are Not Humans"
section = 1
notes = "One person types one request. The agent turns it into many calls against your software: search, read, call an API, run tests, retry. Your next million users are these machine callers. Click: every one of those calls starts with a decision. Which tool, is it safe, is it done. The diagram is illustrative."
builds = [["b1"]]
build_effect = "rise"

[[slides]]
fragment = "slides/05_mostly_decisions.html"
label = "An agent run is mostly decisions"
section = 1
notes = "Take one coding-agent run and tag every step. Two steps write: deciding what to read and writing the change. Six steps decide: routing, gating the edit, diagnosing the test failure, the risky command, the doc page, the done check. Click: six of eight are decisions, and today each one is a full LLM call. Hold on to this run; it comes back in part seven."
builds = [["b1", "b2"]]
build_effect = "rise"

# ---------------------------------------------------------------- 2
[[slides]]
fragment = "slides/06_llm_vs_decision.html"
label = "LLM vs decision model"
section = 2
notes = "An LLM generates text token by token, and you parse it. A decision model answers typed questions: a probability, a choice, a score. From OpenAI's guide: 1 to 400 questions per request, input tokens only at 10 cents per million on gpt-6-luna with output not charged, and about 10x faster than the Responses API. Use the LLM for plans, code and explanations; use the decision model to route, gate, classify and score."

[[slides]]
source = 9
label = "How Decisions works"
section = 2
notes = "Input: shared evidence plus a list of questions. One Decisions call answers them together, each with a typed result. Three primitives. predicate checks a condition and returns the probability that it is true: an if. choice selects one of your values: a switch. score rates against ordered levels and returns the probability-weighted average of the level indices: a slider. One request takes 1 to 400 questions."
text = [
  { frame = "e2", html = "How Decisions works" },
  { frame = "e5", html = "Decisions" },
  { frame = "e6", html = "choice" },
