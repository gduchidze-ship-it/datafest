# ---------------------------------------------------------------- 6
[[slides]]
source = 17
label = "Prompt injection: who guards the guard?"
section = 6
notes = "If a decision model guards the agent, who guards the decision model? It reads the same untrusted input. Watch the scan: it sweeps the document, finds the hidden instruction and marks it untrusted. Treat it as one layer of defence, not a wall: the attack slows down at Decisions, then at code rules, permissions, and finally a human. That is exactly how we built jailbreak detection at Impel."
text = [
  { frame = "e10", html = "Decisions is a layer, not a wall." },
  { frame = "e26", html = "Decisions" },
  { frame = "e9", html = "Decisions" },
]
drop = ["e32", "e6", "e7"]
# the right-hand panel illustrated an option-reordering result measured on the old product
