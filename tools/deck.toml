[[slides]]
fragment = "slides/09_calibration.html"
label = "Calibration"
notes = "Calibration is what makes a probability usable. Take every prediction where the model said 0.5 and put them in one jar; every 0.8 in another; every 0.9 in a third. If the model is calibrated, about half of the 0.5 jar is right, 8 of 10 in the 0.8 jar, 9 of 10 in the 0.9 jar. Each jar is one point on a reliability plot, and the points land on the diagonal. The jars and the plot are illustrative. 0.8 means about 80% of these predictions are right, not that this one is. So measure your own reliability curve before code sets thresholds: golden set, shadow mode, reliability curve, thresholds, then conformal guarantees."

[[slides]]
source = 5
label = "Intelligence is no longer the bottleneck. Reliability is."
notes = "Models are smart enough. The problem is reliability, and reliability depends on what you train for. Three north stars: RLHF puts a human in the loop, RLVR a verifier, RLCD a program."
drop = ["e0", "e27", "e13", "e14"]
