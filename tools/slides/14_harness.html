<div data-frame-id="t" class="fx h1" style="left:128px;top:96px;width:1664px">Agent = model + harness</div>
<div data-frame-id="k" class="fx take" style="left:128px;top:190px;width:1664px">The model writes. The harness decides what it sees, what it is allowed to do, and when it is done.</div>
<div data-frame-id="ex" class="fx small" style="left:128px;top:252px;width:1664px">Harnesses you already use:&nbsp;&nbsp;<span class="chip c-white">Claude Code</span>&nbsp;&nbsp;<span class="chip c-white">Codex</span>&nbsp;&nbsp;<span class="chip c-white">a LangGraph runner</span></div>
<div data-frame-id="b1" class="fx lead" style="left:128px;top:880px;width:1664px">Eight harness jobs. <span class="c-neon">Every one is a question with a typed answer.</span></div>
